<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thunder Dome Basketball League</title>

<style>

body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial;
}

header{
    background:linear-gradient(to right,#ff3c00,#ff0000);
    padding:30px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:50px;
}

.container{
    width:95%;
    margin:auto;
    padding:20px;
}

.section{
    background:#1f1f1f;
    padding:25px;
    border-radius:20px;
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#2b2b2b;
    padding:20px;
    border-radius:20px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#444;
    color:white;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:red;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ff5500;
}

.scoreboard{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:black;
    border-radius:25px;
    padding:30px;
}

.team{
    text-align:center;
    width:40%;
}

.score{
    font-size:80px;
    color:orange;
    font-weight:bold;
}

.middle{
    text-align:center;
}

.rivalry{
    background:linear-gradient(to right,#8b0000,#ff5500);
    padding:20px;
    border-radius:20px;
    margin-top:15px;
}

.player{
    background:#333;
    padding:15px;
    border-radius:15px;
    margin-top:10px;
}

</style>
</head>

<body>

<header>
<h1>THUNDER DOME BASKETBALL LEAGUE</h1>
<p>Basketball Dynasty Simulator</p>
</header>

<div class="container">

<div class="section">

<h2>Big Box Scoreboard</h2>

<div class="scoreboard">

<div class="team">
<h1 id="homeTeam">HOME</h1>
<div class="score" id="homeScore">0</div>

<button onclick="addHomePoints()">+2 Points</button>
<button onclick="homeFT()">+1 Free Throw</button>
</div>

<div class="middle">
<h1>VS</h1>
<h2>Thunder Dome Arena</h2>
</div>

<div class="team">
<h1 id="awayTeam">AWAY</h1>
<div class="score" id="awayScore">0</div>

<button onclick="addAwayPoints()">+2 Points</button>
<button onclick="awayFT()">+1 Free Throw</button>
</div>

</div>

</div>

<div class="section">

<h2>Create Teams</h2>

<div class="grid">

<div class="card">

<input id="homeInput" placeholder="Home Team">

<button onclick="setHomeTeam()">
Set Home Team
</button>

</div>

<div class="card">

<input id="awayInput" placeholder="Away Team">

<button onclick="setAwayTeam()">
Set Away Team
</button>

</div>

</div>

</div>

<div class="section">

<h2>Create Players</h2>

<div class="grid">

<div class="card">

<input id="playerName" placeholder="Player Name">
<input id="playerTeam" placeholder="Team">
<input id="playerPPG" placeholder="PPG">

<button onclick="createPlayer()">
Create Player
</button>

</div>

<div class="card">

<h3>Player List</h3>

<div id="playerList"></div>

</div>

</div>

</div>

<div class="section">

<h2>Franchise Rivalries</h2>

<div class="grid">

<div class="card">

<input id="teamOne" placeholder="Team One">
<input id="teamTwo" placeholder="Team Two">
<input id="winsOne" placeholder="Team One Wins">
<input id="winsTwo" placeholder="Team Two Wins">

<button onclick="createRivalry()">
Create Rivalry
</button>

</div>

<div class="card">

<div id="rivalryList"></div>

</div>

</div>

</div>

</div>

<script>

let homeScore = 0;
let awayScore = 0;

function addHomePoints(){
    homeScore += 2;
    document.getElementById("homeScore").innerText = homeScore;
}

function addAwayPoints(){
    awayScore += 2;
    document.getElementById("awayScore").innerText = awayScore;
}

function homeFT(){
    homeScore += 1;
    document.getElementById("homeScore").innerText = homeScore;
}

function awayFT(){
    awayScore += 1;
    document.getElementById("awayScore").innerText = awayScore;
}

function setHomeTeam(){
    let team = document.getElementById("homeInput").value;
    document.getElementById("homeTeam").innerText = team;
}

function setAwayTeam(){
    let team = document.getElementById("awayInput").value;
    document.getElementById("awayTeam").innerText = team;
}

function createPlayer(){

    let name = document.getElementById("playerName").value;
    let team = document.getElementById("playerTeam").value;
    let ppg = document.getElementById("playerPPG").value;

    let html = `
    <div class="player">
        <h3>${name}</h3>
        <p>Team: ${team}</p>
        <p>PPG: ${ppg}</p>
    </div>
    `;

    document.getElementById("playerList").innerHTML += html;
}

function createRivalry(){

    let one = document.getElementById("teamOne").value;
    let two = document.getElementById("teamTwo").value;
    let wins1 = document.getElementById("winsOne").value;
    let wins2 = document.getElementById("winsTwo").value;

    let html = `
    <div class="rivalry">
        <h2>${one} VS ${two}</h2>
        <p>${one} Wins: ${wins1}</p>
        <p>${two} Wins: ${wins2}</p>
    </div>
    `;

    document.getElementById("rivalryList").innerHTML += html;
}

</script>

</body>
</html>
