<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thunder Dome Basketball League</title>

<style>

body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}

header{
    background:linear-gradient(to right,#ff3c00,#ff0000);
    padding:30px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:50px;
}

header p{
    margin-top:10px;
    font-size:20px;
    color:#ffd5c7;
}

.container{
    width:95%;
    margin:auto;
    padding:20px;
}

.section{
    background:#1c1c1c;
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
}

.section h2{
    margin-top:0;
    color:orange;
    font-size:36px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
    gap:20px;
}

.card{
    background:#2a2a2a;
    border-radius:20px;
    padding:20px;
}

input{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    background:#3a3a3a;
    color:white;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:red;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:#ff5500;
}

.coach-card{
    background:#333;
    border-radius:20px;
    padding:20px;
    margin-top:15px;
    border-left:6px solid orange;
}

.coach-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
}

.coach-header h3{
    margin:0;
    color:orange;
    font-size:28px;
}

.dropdown-btn{
    background:#444;
    width:auto;
    padding:10px 15px;
    font-size:14px;
}

.coach-body{
    display:none;
    margin-top:20px;
}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.stat-box{
    background:#444;
    border-radius:15px;
    padding:15px;
    text-align:center;
}

.stat-box h4{
    margin-top:0;
    color:orange;
}

.stat-number{
    font-size:40px;
    font-weight:bold;
    margin:10px 0;
}

.small-buttons{
    display:flex;
    gap:10px;
}

.small-buttons button{
    margin-top:0;
    padding:10px;
    font-size:14px;
}

.plus-btn{
    background:green;
}

.plus-btn:hover{
    background:#00aa00;
}

.minus-btn{
    background:#8b0000;
}

.minus-btn:hover{
    background:#cc0000;
}

.delete-btn{
    margin-top:20px;
    background:#550000;
}

.delete-btn:hover{
    background:#aa0000;
}

@media(max-width:700px){

    .stat-grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<header>
    <h1>THUNDER DOME BASKETBALL LEAGUE</h1>
    <p>Coaching Legacy Tracker</p>
</header>

<div class="container">

    <div class="section">

        <h2>Coach Legacy System</h2>

        <div class="grid">

            <div class="card">

                <h3>Create Coach</h3>

                <input 
                    type="text" 
                    id="coachName" 
                    placeholder="Enter Coach Name"
                >

                <button onclick="createCoach()">
                    Add Coach
                </button>

            </div>

            <div class="card">

                <h3>Coach Database</h3>

                <div id="coachList"></div>

            </div>

        </div>

    </div>

</div>

<script>

let coaches = [];

function createCoach(){

    let name = document.getElementById("coachName").value;

    if(name.trim() === ""){
        return;
    }

    let coach = {
        id: Date.now(),
        name: name,
        wins: 0,
        losses: 0,
        championships: 0,
        open: false
    };

    coaches.push(coach);

    document.getElementById("coachName").value = "";

    renderCoaches();
}

function toggleCoach(id){

    coaches.forEach(coach => {

        if(coach.id === id){
            coach.open = !coach.open;
        }

    });

    renderCoaches();
}

function changeStat(id, stat, amount){

    coaches.forEach(coach => {

        if(coach.id === id){

            coach[stat] += amount;

            if(coach[stat] < 0){
                coach[stat] = 0;
            }

        }

    });

    renderCoaches();
}

function deleteCoach(id){

    coaches = coaches.filter(coach => coach.id !== id);

    renderCoaches();
}

function renderCoaches(){

    let html = "";

    coaches.forEach(coach => {

        html += `

        <div class="coach-card">

            <div class="coach-header">

                <h3>${coach.name}</h3>

                <button 
                    class="dropdown-btn"
                    onclick="toggleCoach(${coach.id})"
                >
                    ${coach.open ? "Hide Legacy" : "Show Legacy"}
                </button>

            </div>

            <div 
                class="coach-body" 
                style="display:${coach.open ? 'block' : 'none'}"
            >

                <div class="stat-grid">

                    <!-- WINS -->

                    <div class="stat-box">

                        <h4>Wins</h4>

                        <div class="stat-number">
                            ${coach.wins}
                        </div>

                        <div class="small-buttons">

                            <button 
                                class="plus-btn"
                                onclick="changeStat(${coach.id}, 'wins', 1)"
                            >
                                +1
                            </button>

                            <button 
                                class="minus-btn"
                                onclick="changeStat(${coach.id}, 'wins', -1)"
                            >
                                -1
                            </button>

                        </div>

                    </div>

                    <!-- LOSSES -->

                    <div class="stat-box">

                        <h4>Losses</h4>

                        <div class="stat-number">
                            ${coach.losses}
                        </div>

                        <div class="small-buttons">

                            <button 
                                class="plus-btn"
                                onclick="changeStat(${coach.id}, 'losses', 1)"
                            >
                                +1
                            </button>

                            <button 
                                class="minus-btn"
                                onclick="changeStat(${coach.id}, 'losses', -1)"
                            >
                                -1
                            </button>

                        </div>

                    </div>

                    <!-- CHAMPIONSHIPS -->

                    <div class="stat-box">

                        <h4>Championships</h4>

                        <div class="stat-number">
                            ${coach.championships}
                        </div>

                        <div class="small-buttons">

                            <button 
                                class="plus-btn"
                                onclick="changeStat(${coach.id}, 'championships', 1)"
                            >
                                +1
                            </button>

                            <button 
                                class="minus-btn"
                                onclick="changeStat(${coach.id}, 'championships', -1)"
                            >
                                -1
                            </button>

                        </div>

                    </div>

                </div>

                <button 
                    class="delete-btn"
                    onclick="deleteCoach(${coach.id})"
                >
                    Delete Coach
                </button>

            </div>

        </div>

        `;
    });

    document.getElementById("coachList").innerHTML = html;
}

</script>

</body>
</html>
