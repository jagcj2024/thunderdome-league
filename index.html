<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thunder Dome Basketball League - Coach Career Tracker</title>

<style>

body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}

header{
    background:linear-gradient(to right,#ff3c00,#ff0000);
    padding:30px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:50px;
}

header p{
    margin-top:10px;
    color:#ffd4c4;
    font-size:20px;
}

.container{
    width:95%;
    margin:auto;
    padding:20px;
}

.section{
    background:#1c1c1c;
    border-radius:20px;
    padding:25px;
    margin-bottom:25px;
}

.section h2{
    margin-top:0;
    color:orange;
    font-size:36px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
    gap:20px;
}

.card{
    background:#2b2b2b;
    border-radius:20px;
    padding:20px;
}

input{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    background:#3b3b3b;
    color:white;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:red;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ff5500;
}

.coach-card{
    background:linear-gradient(to right,#222,#333);
    border-left:6px solid orange;
    border-radius:20px;
    padding:20px;
    margin-top:15px;
}

.coach-card h3{
    margin-top:0;
    color:orange;
    font-size:30px;
}

.stat{
    background:#444;
    padding:12px;
    border-radius:12px;
    margin-top:10px;
    font-size:18px;
}

.button-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.champ-button{
    background:gold;
    color:black;
}

.champ-button:hover{
    background:#ffd700;
}

.summary{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.summary-box{
    background:#262626;
    padding:20px;
    border-radius:20px;
    text-align:center;
}

.summary-box h3{
    color:orange;
    margin:0;
}

.summary-box p{
    font-size:40px;
    font-weight:bold;
    margin:10px 0 0 0;
}

</style>
</head>

<body>

<header>
<h1>THUNDER DOME BASKETBALL LEAGUE</h1>
<p>Coach Career Tracker</p>
</header>

<div class="container">

<div class="summary">

<div class="summary-box">
<h3>Total Coaches</h3>
<p id="totalCoaches">0</p>
</div>

<div class="summary-box">
<h3>Total Championships</h3>
<p id="totalChampionships">0</p>
</div>

</div>

<div class="section">

<h2>Create Coach</h2>

<div class="grid">

<div class="card">

<input type="text" id="coachName" placeholder="Coach Name">

<input type="text" id="coachTeam" placeholder="Team">

<button onclick="createCoach()">
Create Coach Career
</button>

</div>

<div class="card">

<h2>Coach Careers</h2>

<div id="coachList"></div>

</div>

</div>

</div>

</div>

<script>

let coaches = [];

function updateSummary(){

    document.getElementById("totalCoaches").innerText =
        coaches.length;

    let championships = 0;

    coaches.forEach(coach => {
        championships += coach.championships;
    });

    document.getElementById("totalChampionships").innerText =
        championships;
}

function createCoach(){

    let name = document.getElementById("coachName").value;
    let team = document.getElementById("coachTeam").value;

    if(name === "" || team === ""){
        alert("Enter coach name and team");
        return;
    }

    let coach = {
        id: Date.now(),
        name:name,
        team:team,
        wins:0,
        losses:0,
        championships:0
    };

    coaches.push(coach);

    renderCoaches();

    document.getElementById("coachName").value = "";
    document.getElementById("coachTeam").value = "";
}

function addWin(id){

    coaches.forEach(coach => {
        if(coach.id === id){
            coach.wins++;
        }
    });

    renderCoaches();
}

function addLoss(id){

    coaches.forEach(coach => {
        if(coach.id === id){
            coach.losses++;
        }
    });

    renderCoaches();
}

function addChampionship(id){

    coaches.forEach(coach => {
        if(coach.id === id){
            coach.championships++;
        }
    });

    renderCoaches();
}

function renderCoaches(){

    let html = "";

    coaches.forEach(coach => {

        html += `

        <div class="coach-card">

            <h3>${coach.name}</h3>

            <div class="stat">
                Team: ${coach.team}
            </div>

            <div class="stat">
                Wins: ${coach.wins}
            </div>

            <div class="stat">
                Losses: ${coach.losses}
            </div>

            <div class="stat">
                Championships: ${coach.championships}
            </div>

            <div class="button-row">

                <button onclick="addWin(${coach.id})">
                    Add Win
                </button>

                <button onclick="addLoss(${coach.id})">
                    Add Loss
                </button>

            </div>

            <button class="champ-button"
                onclick="addChampionship(${coach.id})">

                Add Championship

            </button>

        </div>

        `;
    });

    document.getElementById("coachList").innerHTML = html;

    updateSummary();
}

</script>

</body>
</html>
